name: Sync agenda campanha

on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sincronizar visitas da agenda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync agenda
        run: npm run sync:agenda
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
